project:
  tracker_project_name: "seg2any"
  # Absolute path on ssd3: checkpoints are ~600MB each and must not land in $HOME.
  output_dir: "/export/ssd3/lan-y/seg2any_ckpt/uecfoodpix"
  logging_dir: "logs"
  gen_image_dir: "gen_imgs"
  report_to: "tensorboard" # The integration to report the results and logs to. Supported platforms are `"tensorboard"`, `"wandb"` and `"comet_ml"`. Use `"all"` to report to all integrations.

resolution: &resolution 512
cond_scale_factor: &cond_scale_factor 1 # condition_resolution == resolution // cond_scale_factor
dataset_root: &dataset_root /export/ssd3/lan-y/UECFOODPIXCOMPLETE
data:
  train:
    target: dataset.uecfoodpix_dataset.UECFoodPixDataset
    params:
      dataset_root: *dataset_root
      split_file: data/train9000.txt # relative paths resolve against dataset_root
      image_dir: train
      is_group_bucket: True # 9000 samples is plenty to bucket by text/cond token count, so padding tokens are not paid for.
      cache_root: /export/ssd3/lan-y/seg2any_data/uecfoodpix/cache # where group_bucket.parquet is stored. Only used when is_group_bucket=True.
      resolution: *resolution
      cond_scale_factor: *cond_scale_factor
  val:
    target: dataset.uecfoodpix_dataset.UECFoodPixDataset
    params:
      dataset_root: *dataset_root
      split_file: data/test1000.txt # the official held-out split, kept intact so later FID/mIoU uses the same images
      image_dir: test
      is_group_bucket: False
      resolution: *resolution
      cond_scale_factor: *cond_scale_factor

model:
  pretrained_model_name_or_path: black-forest-labs/FLUX.1-dev

  attention_mask_method: "base" # choices: ["hard", "base", "place"]
  hard_attn_block_range: [19,37] # valid when attention_mask_method == "hard"
  is_use_cond_token: True # text, image and cond tokens (Entity Contour Map) concatenated into unified sequence
  is_filter_cond_token: True # drop zero-value condition image tokens

  rank: 32 # between the ramen run (16, 500 images) and upstream ADE20K (64); 9000 images support the larger adapter
  default_lora_layers: "all-linear-in-dit-blocks" # for text and noisy image branch
  cond_lora_layers: "regular_expression:(.*x_embedder|.*(?<!single_)transformer_blocks\\.[0-9]+\\.norm1\\.linear|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_k|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_q|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_v|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_out\\.0|.*(?<!single_)transformer_blocks\\.[0-9]+\\.ff\\.net\\.2|.*(?<!single_)transformer_blocks\\.[0-9]+\\.ff\\.net\\.0\\.proj|.*single_transformer_blocks\\.[0-9]+\\.norm\\.linear|.*single_transformer_blocks\\.[0-9]+\\.proj_mlp|.*single_transformer_blocks\\.[0-9]+\\.proj_out|.*single_transformer_blocks\\.[0-9]+\\.attn.to_k|.*single_transformer_blocks\\.[0-9]+\\.attn.to_q|.*single_transformer_blocks\\.[0-9]+\\.attn.to_v|.*single_transformer_blocks\\.[0-9]+\\.attn.to_out)"
  # for conditon branch, refer to https://github.com/Yuanshi9815/OminiControl
  use_lora_bias: False
  gaussian_init_lora: False

  num_inference_steps: 32

  max_sequence_length: 512
  # Bare class names as in ADE20K/COCO-Stuff, but UECFOODPIX names run longer than ADE20K's:
  # measured max is 13 T5 tokens ("kinpira-style sauteed burdock"), and at 10 three classes
  # (id 4, 89, 93 -- 265 train images) were silently truncated. 16 clears the longest with margin.
  regional_max_sequence_length: 16

  weighting_scheme: "none" #  "sigma_sqrt", "logit_normal", "mode", "cosmap", "none"
  logit_mean: 0 # mean to use when using the `'logit_normal'` weighting scheme.
  logit_std: 1 # std to use when using the `'logit_normal'` weighting scheme.
  mode_scale: 1.29 # Scale of mode weighting scheme. Only effective when using the `'mode'` as the `weighting_scheme`.

optimizer:
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1e-2
  adam_epsilon: 1e-08
  max_grad_norm: 1

scheduler:
  lr_scheduler: "constant" # ["linear","cosine","cosine_with_restarts","polynomial","constant","constant_with_warmup"]
  lr_warmup_steps: 0
  lr_num_cycles: 1 # Number of hard resets of the lr in cosine_with_restarts scheduler
  lr_power: 1 # Power factor of the polynomial scheduler.

trainer:
  guidance_scale: 1
  # A100 80GB: measured 45.6GiB/80GiB at bs 8, 6.2 s/step. 2 ranks x 8 = effective batch 16,
  # the same as the original gp38 plan (8 ranks x 2). Drop to 4 on a 48GB card.
  train_batch_size: 8 # Batch size (per device) for the training dataloader

  learning_rate: 1e-4

  scale_lr: False # Scale the learning rate by the number of GPUs, gradient accumulation steps, and batch size.

  gradient_accumulation_steps: 1
  gradient_checkpointing: True
  offload: False

  # How many ranks may load FLUX into host RAM at the same time. With the bf16 load in
  # train.py a rank peaks at a measured 10.4GB, so 8 at once (~83GB) is already survivable
  # on a 251GB node; this keeps the transient down to ~21GB as a safety margin.
  # Note offload=True is NOT a way to reduce host RAM: it parks T5 (~9.5GB/rank) in CPU
  # memory every step. It trades host RAM for GPU memory, which is the wrong direction here.
  load_group_size: 2

  num_train_epochs: 1
  # Sized to finish overnight on 2x A100 80GB: 6.2 s/step measured, plus ~150s per 1000 steps
  # for validation and checkpointing, gives 5500 x 6.35s ~= 9.7 hours.
  # 5500 steps x 2 ranks x bs 8 = 88k samples ~= 9.8 epochs over the 9000 train images.
  max_train_steps: 5500 # Total number of training steps to perform. If provided, overrides num_train_epochs.
  num_validation_images: 8 # num of log_validation images

  validation_steps: 1000

  checkpointing_steps: 1000
  checkpoints_total_limit: 10 # Max number of checkpoints to store.

  allow_tf32: False

eval:
  num_images_per_prompt: 4
  guidance_scale: 3.5

dataloader_num_workers: 2 # x8 ranks = 16 workers on 32 cores; 4 oversubscribed the node
seed: 42
mixed_precision: "bf16" #  "no", "fp16", "bf16"
resume_from_checkpoint: null # resumed from a previous checkpoint. Use a path saved by `--checkpointing_steps`, or `"latest"` to automatically select the last available checkpoint.
